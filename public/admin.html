<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Stargame Elite</title><link rel="stylesheet" href="/styles.css"><style>.admin-wrap{max-width:1000px;margin:40px auto;padding:20px}.admin-box{background:#151515;border:1px solid #5e4a1c;border-radius:14px;padding:20px;margin:18px 0}.admin-box h2{color:#d9b65b}.admin-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.admin-form input{min-width:0;padding:12px;border-radius:8px;border:1px solid #555;background:#090909;color:#fff}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:left;padding:11px;border-bottom:1px solid #333}.admin-table th{color:#d9b65b}.danger{background:#692626;color:#fff;border:0;padding:8px 12px;border-radius:7px}.muted{color:#aaa}.msg{margin-top:12px;color:#e6c56b}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-table{font-size:12px}.admin-table th,.admin-table td{padding:7px}}</style><script src="/admin.js" defer></script></head><body><div class="admin-wrap"><p><a href="/" style="color:#d9b65b">← Volver a Stargame Elite</a></p><h1>Panel de administración</h1><p class="muted">Gestión básica de cuentas de prueba. No se muestran contraseñas.</p><section class="admin-box"><h2>Crear usuario</h2><form id="create-user" class="admin-form"><input id="new-username" placeholder="Nombre de usuario" minlength="3" maxlength="20" required><input id="new-password" type="password" placeholder="Contraseña (10 caracteres mínimo)" minlength="10" maxlength="72" required><button class="btn btn-gold" type="submit">Crear cuenta</button></form><div id="message" class="msg" role="status"></div></section><section class="admin-box"><h2>Usuarios registrados</h2><p id="count" class="muted">Cargando…</p><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>ID</th><th>Usuario</th><th>Rol</th><th>Alta</th><th>Último acceso</th><th>Acción</th></tr></thead><tbody id="users"></tbody></table></div></section><button id="refresh" class="btn btn-outline">Actualizar lista</button></div></body></html>
